<svg viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent robot connected to plan, bill and pharmacy nodes">
  <rect x="20" y="20" width="560" height="410" rx="24" fill="#f7f9fd"/>

  <!-- connection lines -->
  <g stroke="#c9ddf7" stroke-width="5" stroke-linecap="round">
    <line x1="300" y1="225" x2="130" y2="110"/>
    <line x1="300" y1="225" x2="470" y2="110"/>
    <line x1="300" y1="225" x2="130" y2="345"/>
    <line x1="300" y1="225" x2="470" y2="345"/>
  </g>
  <!-- active data pulses -->
  <g fill="#1c69d4">
    <circle cx="215" cy="167" r="6"/>
    <circle cx="385" cy="167" r="6"/>
    <circle cx="215" cy="285" r="6"/>
    <circle cx="385" cy="285" r="6"/>
  </g>

  <!-- node: plan card (top-left) -->
  <g transform="translate(130 110)">
    <circle cx="0" cy="0" r="46" fill="#ffffff" stroke="#c9ddf7" stroke-width="3"/>
    <rect x="-24" y="-16" width="48" height="32" rx="6" fill="#1c69d4"/>
    <rect x="-24" y="-16" width="48" height="10" rx="5" fill="#0653b6"/>
    <rect x="-18" y="4" width="22" height="5" rx="2.5" fill="#c9ddf7"/>
  </g>
  <!-- node: bill/document (top-right) -->
  <g transform="translate(470 110)">
    <circle cx="0" cy="0" r="46" fill="#ffffff" stroke="#c9ddf7" stroke-width="3"/>
    <rect x="-20" y="-26" width="40" height="52" rx="6" fill="#e8f0fc" stroke="#1c69d4" stroke-width="3"/>
    <rect x="-12" y="-14" width="24" height="5" rx="2.5" fill="#1c69d4"/>
    <rect x="-12" y="-2" width="24" height="5" rx="2.5" fill="#c9ddf7"/>
    <rect x="-12" y="10" width="16" height="6" rx="3" fill="#f59e0b"/>
  </g>
  <!-- node: pill/pharmacy (bottom-left) -->
  <g transform="translate(130 345)">
    <circle cx="0" cy="0" r="46" fill="#ffffff" stroke="#c9ddf7" stroke-width="3"/>
    <g transform="rotate(45)">
      <rect x="-26" y="-12" width="52" height="24" rx="12" fill="#1c69d4"/>
      <rect x="0" y="-12" width="26" height="24" rx="12" fill="#22c55e"/>
    </g>
  </g>
  <!-- node: shield (bottom-right) -->
  <g transform="translate(470 345)">
    <circle cx="0" cy="0" r="46" fill="#ffffff" stroke="#c9ddf7" stroke-width="3"/>
    <path d="M0 -26 L24 -17 L24 4 C24 20 13 30 0 36 C-13 30 -24 20 -24 4 L-24 -17 Z" fill="#1c69d4"/>
    <path d="M-9 4 l6 7 l13 -15" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- central AGENT robot -->
  <g transform="translate(300 225)">
    <circle cx="0" cy="0" r="74" fill="#1c69d4" opacity="0.10"/>
    <circle cx="0" cy="0" r="62" fill="#ffffff" stroke="#1c69d4" stroke-width="4"/>
    <!-- antenna -->
    <line x1="0" y1="-40" x2="0" y2="-56" stroke="#1c69d4" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="0" cy="-60" r="6" fill="#22c55e"/>
    <!-- head -->
    <rect x="-34" y="-34" width="68" height="56" rx="18" fill="#1c69d4"/>
    <circle cx="-12" cy="-8" r="8" fill="#ffffff"/>
    <circle cx="12" cy="-8" r="8" fill="#ffffff"/>
    <circle cx="-11" cy="-6" r="3.5" fill="#1c69d4"/>
    <circle cx="13" cy="-6" r="3.5" fill="#1c69d4"/>
    <!-- mouth -->
    <rect x="-12" y="8" width="24" height="6" rx="3" fill="#c9ddf7"/>
    <!-- ears -->
    <rect x="-42" y="-16" width="9" height="22" rx="4.5" fill="#c9ddf7"/>
    <rect x="33" y="-16" width="9" height="22" rx="4.5" fill="#c9ddf7"/>
    <!-- body collar -->
    <path d="M-30 30 C-30 50 30 50 30 30" fill="none" stroke="#e8f0fc" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
