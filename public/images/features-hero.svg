<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent orchestrating multiple healthcare tasks">
  <rect x="20" y="20" width="560" height="360" rx="24" fill="#f7f9fd"/>

  <!-- orbit rings -->
  <ellipse cx="300" cy="200" rx="240" ry="120" fill="none" stroke="#e8f0fc" stroke-width="3"/>
  <ellipse cx="300" cy="200" rx="160" ry="78" fill="none" stroke="#c9ddf7" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- connector spokes -->
  <g stroke="#c9ddf7" stroke-width="4" stroke-linecap="round">
    <line x1="300" y1="200" x2="80" y2="200"/>
    <line x1="300" y1="200" x2="520" y2="200"/>
    <line x1="300" y1="200" x2="180" y2="86"/>
    <line x1="300" y1="200" x2="420" y2="86"/>
    <line x1="300" y1="200" x2="300" y2="320"/>
  </g>

  <!-- task icon: shield (left) -->
  <g transform="translate(80 200)">
    <circle cx="0" cy="0" r="34" fill="#ffffff" stroke="#c9ddf7" stroke-width="3"/>
    <path d="M0 -18 L17 -12 L17 2 C17 13 9 20 0 24 C-9 20 -17 13 -17 2 L-17 -12 Z" fill="#1c69d4"/>
    <path d="M-6 2 l4 5 l9 -11" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- task icon: magnifier (top-left) -->
  <g transform="translate(180 86)">
    <circle cx="0" cy="0" r="34" fill="#ffffff" stroke="#c9ddf7" stroke-width="3"/>
    <circle cx="-4" cy="-4" r="13" fill="none" stroke="#1c69d4" stroke-width="5"/>
    <line x1="6" y1="6" x2="16" y2="16" stroke="#1c69d4" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- task icon: gauge (top-right) -->
  <g transform="translate(420 86)">
    <circle cx="0" cy="0" r="34" fill="#ffffff" stroke="#c9ddf7" stroke-width="3"/>
    <path d="M-16 6 A16 16 0 0 1 16 6" fill="none" stroke="#e8f0fc" stroke-width="6" stroke-linecap="round"/>
    <path d="M-16 6 A16 16 0 0 1 4 -15" fill="none" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="6" x2="9" y2="-7" stroke="#1c69d4" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="6" r="4" fill="#1c69d4"/>
  </g>
  <!-- task icon: pill (right) -->
  <g transform="translate(520 200)">
    <circle cx="0" cy="0" r="34" fill="#ffffff" stroke="#c9ddf7" stroke-width="3"/>
    <g transform="rotate(45)">
      <rect x="-18" y="-9" width="36" height="18" rx="9" fill="#1c69d4"/>
      <rect x="0" y="-9" width="18" height="18" rx="9" fill="#22c55e"/>
    </g>
  </g>
  <!-- task icon: document (bottom) -->
  <g transform="translate(300 320)">
    <circle cx="0" cy="0" r="34" fill="#ffffff" stroke="#c9ddf7" stroke-width="3"/>
    <rect x="-15" y="-19" width="30" height="38" rx="5" fill="#e8f0fc" stroke="#1c69d4" stroke-width="3"/>
    <rect x="-9" y="-10" width="18" height="4" rx="2" fill="#1c69d4"/>
    <rect x="-9" y="-1" width="18" height="4" rx="2" fill="#c9ddf7"/>
    <rect x="-9" y="8" width="12" height="4" rx="2" fill="#f59e0b"/>
  </g>

  <!-- central AGENT robot -->
  <g transform="translate(300 200)">
    <circle cx="0" cy="0" r="66" fill="#1c69d4" opacity="0.10"/>
    <circle cx="0" cy="0" r="54" fill="#ffffff" stroke="#1c69d4" stroke-width="4"/>
    <line x1="0" y1="-36" x2="0" y2="-50" stroke="#1c69d4" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="0" cy="-54" r="6" fill="#22c55e"/>
    <rect x="-30" y="-30" width="60" height="50" rx="16" fill="#1c69d4"/>
    <circle cx="-11" cy="-7" r="7.5" fill="#ffffff"/>
    <circle cx="11" cy="-7" r="7.5" fill="#ffffff"/>
    <circle cx="-10" cy="-5" r="3.2" fill="#1c69d4"/>
    <circle cx="12" cy="-5" r="3.2" fill="#1c69d4"/>
    <rect x="-11" y="8" width="22" height="6" rx="3" fill="#c9ddf7"/>
    <rect x="-38" y="-14" width="8" height="20" rx="4" fill="#c9ddf7"/>
    <rect x="30" y="-14" width="8" height="20" rx="4" fill="#c9ddf7"/>
  </g>
</svg>
