<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shield blocking a surprise bill">
  <rect x="40" y="40" width="320" height="220" rx="20" fill="#f7f9fd"/>

  <!-- incoming surprise bill being deflected -->
  <g transform="rotate(16 286 120)">
    <rect x="250" y="74" width="86" height="108" rx="10" fill="#ffffff" stroke="#c9ddf7" stroke-width="3"/>
    <rect x="250" y="74" width="86" height="26" rx="10" fill="#f59e0b"/>
    <rect x="264" y="116" width="58" height="8" rx="4" fill="#e8f0fc"/>
    <rect x="264" y="134" width="44" height="8" rx="4" fill="#e8f0fc"/>
    <rect x="264" y="158" width="36" height="11" rx="5.5" fill="#f59e0b"/>
  </g>

  <!-- alert badge -->
  <g transform="translate(330 78)">
    <circle cx="0" cy="0" r="17" fill="#f59e0b"/>
    <rect x="-3" y="-10" width="6" height="12" rx="3" fill="#ffffff"/>
    <circle cx="0" cy="7" r="3" fill="#ffffff"/>
  </g>

  <!-- deflection sparks -->
  <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round">
    <line x1="206" y1="96" x2="222" y2="86"/>
    <line x1="214" y1="124" x2="234" y2="120"/>
    <line x1="210" y1="160" x2="228" y2="166"/>
  </g>

  <!-- protective shield -->
  <g transform="translate(150 150)">
    <path d="M0 -80 L74 -52 L74 26 C74 78 40 108 0 128 C-40 108 -74 78 -74 26 L-74 -52 Z" fill="#1c69d4"/>
    <path d="M0 -64 L58 -42 L58 22 C58 64 32 88 0 104 C-32 88 -58 64 -58 22 L-58 -42 Z" fill="#e8f0fc"/>
    <path d="M-26 16 l18 20 l38 -46" stroke="#1c69d4" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
